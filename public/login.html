<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 智拓客</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-primary: #2563eb;
      --blue-dark: #1d4ed8;
      --bg-dark: #030303;
      --bg-mid: #1e3a5f;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(148,163,184,0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      height: 64px;
      background: rgba(3,3,3,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .nav-links a:hover { color: var(--text-white); }
    .btn-nav {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1.2rem;
      background: rgba(99,102,241,0.18);
      color: #c7d2fe !important;
      border: 1px solid rgba(99,102,241,0.45);
      border-radius: 9px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.25s ease;
    }
    .btn-nav:hover {
      background: rgba(99,102,241,0.3);
      border-color: rgba(99,102,241,0.6);
      color: #fff !important;
      transform: translateY(-1px);
    }

    /* hamburger */
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
    .hamburger span { display: block; width: 24px; height: 2px; background: var(--text-white); border-radius: 2px; transition: 0.3s; }

    @media (max-width: 640px) {
      .hamburger { display: flex; }
      .nav-links {
        display: none;
        position: absolute;
        top: 64px; left: 0; right: 0;
        background: #0d1729;
        flex-direction: column;
        padding: 1rem 6%;
        gap: 1rem;
        border-bottom: 1px solid var(--border-subtle);
        z-index: 99;
      }
      .nav-links.open { display: flex; }
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 12px;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99,102,241,0.1) 0%, transparent 70%);
    }

    /* ── CARD ── */
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #030303;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148,163,184,0.12);
      border-radius: 16px;
      padding: 40px 32px;
    }

    .card-logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .card-logo-text {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #2563eb, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .card-logo-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card-heading {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-white);
      text-align: center;
      margin-bottom: 28px;
    }

    /* ── AUTH TABS (登录 / 注册) ── */
    .auth-tabs {
      display: flex;
      gap: 6px;
      background: rgba(15,23,42,0.6);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      padding: 9px 0;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.18s;
    }
    .auth-tab.active {
      background: #2563eb;
      color: #fff;
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .form-group input[type="password"],
    .form-group input[type="email"],
    .form-group input[type="text"] {
      width: 100%;
      background: rgba(15,23,42,0.6);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 10px;
      padding: 12px 14px;
      color: #f8fafc;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input[type="password"]::placeholder,
    .form-group input[type="email"]::placeholder,
    .form-group input[type="text"]::placeholder {
      color: #475569;
    }
    .form-group input[type="password"]:focus,
    .form-group input[type="email"]:focus,
    .form-group input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    /* ── CONSENT ── */
    .consent-block {
      margin: 16px 0;
      padding: 12px 14px;
      background: rgba(99,102,241,0.08);
      border-radius: 8px;
    }
    .consent-block label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .consent-block input[type="checkbox"] {
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: #2563eb;
    }
    .consent-block a {
      color: #60a5fa;
      text-decoration: none;
    }
    .consent-block a:hover { text-decoration: underline; }

    /* ── BUTTON ── */
    .btn-login {
      width: 100%;
      padding: 13px 20px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37,99,235,0.4);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 4px;
    }
    .btn-login:hover:not(:disabled) {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(37,99,235,0.5);
    }
    .btn-login:disabled {
      background: rgba(100,116,139,0.35);
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* ── ERROR ── */
    .error-msg {
      display: none;
      margin-top: 10px;
      font-size: 0.83rem;
      color: #f87171;
      text-align: center;
    }
    .error-msg.visible { display: block; }

    .ok-msg {
      display: none;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #34d399;
      text-align: center;
      line-height: 1.5;
    }
    .ok-msg.visible { display: block; }

    .auth-recovery {
      display: none;
      margin-top: 12px;
      text-align: center;
    }
    .auth-recovery.visible { display: block; }
    .auth-recovery button {
      border: 0;
      background: transparent;
      color: #60a5fa;
      font: inherit;
      font-size: 0.84rem;
      cursor: pointer;
      padding: 6px 10px;
    }
    .auth-recovery button:hover { text-decoration: underline; }
    .auth-recovery button:disabled { color: #64748b; cursor: wait; }

    /* ── HELPER TEXT ── */
    .helper-text {
      margin-top: 16px;
      font-size: 0.78rem;
      color: #475569;
      text-align: center;
      line-height: 1.6;
    }

    /* ── FOOTER ── */
    footer {
      background: #070e1a;
      border-top: 1px solid var(--border-subtle);
      padding: 2rem 6%;
      text-align: center;
    }
    .footer-logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.6rem;
    }
    .footer-copy { font-size: 0.82rem; color: #475569; margin-bottom: 0.3rem; }
    .footer-sub { font-size: 0.78rem; color: #334155; }

    @media (max-width: 640px) {
      main {
        width: 100%;
        min-width: 0;
      }
      .login-card {
        width: 100%;
        max-width: 440px;
        min-width: 0;
        padding: 28px 16px;
      }
      .auth-tabs,
      .auth-form,
      .form-group,
      .consent-block { min-width: 0; max-width: 100%; }
      main {
        align-items: flex-start;
        padding-top: 32px;
      }
    }
  </style>
  <link rel="stylesheet" href="/styles/neumorphic.css">
<script src="/assets/site-preferences.js"></script>
</head>
<body class="neu-theme">

<!-- NAV -->
<nav id="navbar">
  <a href="/" style="text-decoration:none;display:flex;align-items:center">
    <div style="position:relative;display:flex;align-items:center;gap:14px;padding:14px 18px">
      <div style="position:absolute;inset:-4px;background:radial-gradient(ellipse 60% 80% at 18% 50%,rgba(91,141,239,0.32) 0%,transparent 70%);filter:blur(10px);z-index:0;pointer-events:none"></div>

        <div style="display:flex;gap:2px"><div style="width:8px;height:5px;background:#7da7f0;border-radius:1px"></div><div style="width:14px;height:5px;background:#7da7f0;border-radius:1px"></div></div>
        <div style="display:flex;gap:2px"><div style="width:14px;height:5px;background:#a8c5ff;border-radius:1px"></div><div style="width:8px;height:5px;background:#a8c5ff;border-radius:1px"></div></div>

      <span style="font-size:30px;font-weight:600;color:#e8eef8;letter-spacing:0.05em;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;position:relative;z-index:1">智拓客</span>

<!-- MAIN -->
<main>
  <div class="login-card">
    <div class="card-logo">

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabLogin" onclick="setMode('login')">登录</button>

<script>
  /* Pick redirect target: honor ?redirect= when it's a same-origin absolute path. */
  function _redirectTarget() {
    const p = new URLSearchParams(location.search).get('redirect') || '';
    return /^\/[^/]/.test(p) ? p : '/app';
  }

  function _isAuthCallback() {
    const query = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.slice(1));
    return query.get('email_confirmed') === '1' || hash.has('access_token') ||
      hash.has('error_description') || hash.get('type') === 'signup';
  }

  /* Auto-redirect if already logged in (either auth scheme leaves the JWT
     under leadgen_accessToken; the supabase session blob is the source of
     truth but checking the token is faster). */
  (function() {
    const token = localStorage.getItem('leadgen_accessToken');
    if (token && token.trim() && !_isAuthCallback()) {
      window.location.href = _redirectTarget();
    }
  })();

  let _authMode = 'login'; // 'login' | 'register'

  function _showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function _loginError(message) {
    const raw = String(message || '');
    if (/Email not confirmed/i.test(raw)) {
      return { message: '这个邮箱还没确认。请点下面“重新发送确认邮件”，然后去邮箱完成确认。', canResend: true };
    }
    if (/Invalid login credentials/i.test(raw)) {
      return { message: '邮箱或密码不正确。请检查后重试；如果刚注册，请先确认邮箱。', canResend: true };
    }
    if (/rate limit|too many requests/i.test(raw)) {
      return { message: '尝试次数太多，请稍等几分钟再试。', canResend: false };
    }
    return { message: '登录失败：' + (raw || '请稍后再试'), canResend: false };
  }

  function _showRecovery(show) {
    document.getElementById('authRecovery').classList.toggle('visible', !!show);
  }

  function updateButtonState() {
    const email   = document.getElementById('loginEmail').value.trim();
    const pwd     = document.getElementById('loginPassword').value;
    const agreed  = document.getElementById('agreeTerms').checked;
    let ok = !!(email && pwd && agreed);
    if (_authMode === 'register') {
      ok = ok && !!document.getElementById('loginPasswordConfirm').value;
    }
    document.getElementById('loginBtn').disabled = !ok;
  }

  function _showOk(msg) {
    const el = document.getElementById('okMsg');
    el.textContent = msg;
    el.classList.add('visible');
    document.getElementById('errorMsg').classList.remove('visible');
  }

  async function _handleEmailConfirmationCallback() {
    if (!_isAuthCallback()) return;

    const hash = new URLSearchParams(window.location.hash.slice(1));
    const callbackError = hash.get('error_description');
    if (callbackError) {
      _showError('邮箱确认失败：' + callbackError.replace(/\+/g, ' '));
      return;
    }

    const accessToken = hash.get('access_token');
    const refreshToken = hash.get('refresh_token');
    if (accessToken && refreshToken) {
      const expiresIn = Number(hash.get('expires_in')) || 3600;
      const session = {
        access_token: accessToken,
        refresh_token: refreshToken,
        token_type: hash.get('token_type') || 'bearer',
        expires_in: expiresIn,
        expires_at: Math.floor(Date.now() / 1000) + expiresIn,
      };
      localStorage.setItem('leadgen_accessToken', accessToken);
      localStorage.setItem('leadgen_supabase_session', JSON.stringify(session));
      window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
      _showOk('邮箱确认成功，正在进入应用…');
      window.setTimeout(() => window.location.replace(_redirectTarget()), 600);
      return;
    }

    setMode('login');
    _showError('确认链接已失效或已使用。请重新发送确认邮件，再点最新邮件中的链接。');
  }
  function _regError(m) {
    m = m || '';
    if (/already registered|already exists|User already/i.test(m)) return '该邮箱已注册，请直接登录。';
    if (/password/i.test(m) && /6/.test(m)) return '密码至少 6 位。';
    if (/valid email|invalid email/i.test(m)) return '邮箱格式不对。';
    return '注册失败：' + m;
  }
  async function _authProxyRequest(action, payload) {
    const response = await fetch('/api/auth/' + encodeURIComponent(action), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(data.msg || data.message || data.error_description || data.error || ('HTTP ' + response.status));
    }
    return data;
  }
  function setMode(mode) {
    _authMode = mode;
    document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
    document.getElementById('confirmPwdGroup').style.display = mode === 'register' ? 'block' : 'none';
    document.getElementById('loginBtn').textContent = mode === 'register' ? '注册并进入' : '登录 / 进入应用';
    document.getElementById('loginPassword').setAttribute('autocomplete', mode === 'register' ? 'new-password' : 'current-password');
    document.getElementById('helperText').textContent = mode === 'register'
      ? '注册后如提示「请确认邮箱」，去邮箱点一下确认链接再回来登录。'
      : '没有账号？点上面「注册」，几秒就能开通。';
    document.getElementById('errorMsg').classList.remove('visible');
    document.getElementById('okMsg').classList.remove('visible');
    _showRecovery(false);
    updateButtonState();
  }

  function onFieldInput() {
    updateButtonState();
    document.getElementById('errorMsg').classList.remove('visible');
    document.getElementById('okMsg').classList.remove('visible');
    _showRecovery(false);
  }

  function onConsentChange() {
    updateButtonState();
    document.getElementById('errorMsg').classList.remove('visible');
  }

  async function doSubmit() {
    const email  = document.getElementById('loginEmail').value.trim();
    const pwd    = document.getElementById('loginPassword').value;
    const agreed = document.getElementById('agreeTerms').checked;
    if (!email || !pwd || !agreed) {
      _showError('请填写邮箱和密码并同意用户协议');
      return;
    }
    if (_authMode === 'register') {
      const confirm = document.getElementById('loginPasswordConfirm').value;
      if (pwd.length < 6) { _showError('密码至少 6 位'); return; }
      if (pwd !== confirm) { _showError('两次输入的密码不一致'); return; }
    }

    const btn = document.getElementById('loginBtn');
    const origText = btn.textContent;
    btn.disabled = true;
    btn.textContent = _authMode === 'register' ? '注册中…' : '登录中…';

    try {
      if (_authMode === 'register') {
        const data = await _authProxyRequest('signup', { email, password: pwd });
        // Email-confirmation OFF in Supabase → a session is returned, log in directly.
        const rawSession = data?.session || (data?.access_token ? data : null);
        const session = rawSession ? {
          ...rawSession,
          expires_at: rawSession.expires_at || Math.floor(Date.now() / 1000) + (Number(rawSession.expires_in) || 3600),
        } : null;
        if (session?.access_token) {
          localStorage.setItem('leadgen_accessToken', session.access_token);
          localStorage.setItem('leadgen_supabase_session', JSON.stringify(session));
          window.location.href = _redirectTarget();
          return;
        }
        // Otherwise email confirmation is required.
        setMode('login');
        _showOk('注册成功！请到邮箱点确认链接，然后回来登录。');
        return;
      }

      // login
      let data;
      try {
        data = await _authProxyRequest('login', { email, password: pwd });
      } catch (error) {
        const failure = _loginError(error.message);
        _showError(failure.message);
        _showRecovery(failure.canResend);
        return;
      }
      if (!data?.access_token) {
        _showError('登录失败：认证服务没有返回登录凭证，请重试。');
        return;
      }
      data.expires_at = data.expires_at || Math.floor(Date.now() / 1000) + (Number(data.expires_in) || 3600);
      localStorage.setItem('leadgen_accessToken', data.access_token);
      localStorage.setItem('leadgen_supabase_session', JSON.stringify(data));
      window.location.href = _redirectTarget();
    } catch (e) {
      console.error('[auth] error:', e);
      _showError('操作失败：' + (e.message || '请稍后再试'));
    } finally {
      btn.disabled = false;
      btn.textContent = origText;
      updateButtonState();
    }
  }

  async function resendConfirmation() {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) {
      _showError('请先填写注册时使用的邮箱。');
      return;
    }
    const button = document.getElementById('resendConfirmBtn');
    button.disabled = true;
    button.textContent = '发送中…';
    try {
      await _authProxyRequest('resend', { email });
      _showRecovery(false);
      _showOk('确认邮件已重新发送。请打开邮箱里的链接，确认后再回来登录。');
    } catch (error) {
      const failure = _loginError(error?.message);
      _showError(failure.message);
    } finally {
      button.disabled = false;
      button.textContent = '重新发送确认邮件';
    }
  }

  _handleEmailConfirmationCallback().catch(error => {
    console.error('[auth] email confirmation callback failed:', error);
    _showError('处理邮箱确认失败：' + (error.message || '请刷新页面重试'));
  });

  /* Allow Enter key to submit from either field. */
  ['loginEmail', 'loginPassword', 'loginPasswordConfirm'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doSubmit();
    });
  });

  /* Hamburger */
  const hamburger = document.getElementById('hamburger');
  const navLinks = document.getElementById('navLinks');
  hamburger.addEventListener('click', () => {
    navLinks.classList.toggle('open');
    hamburger.setAttribute('aria-expanded', String(navLinks.classList.contains('open')));
  });
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    navLinks.classList.remove('open');
    hamburger.setAttribute('aria-expanded', 'false');
  }));
</script>
</body>
</html>
