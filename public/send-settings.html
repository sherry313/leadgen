<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮件发送设置 - 智拓客</title>
<link rel="stylesheet" href="/vendor/tabler/tabler-icons.min.css">
<style>
  :root{ --bg:#030303; --card:rgba(255,255,255,0.03); --bd:rgba(255,255,255,0.08); --bd2:rgba(255,255,255,0.12);
    --tx:#e5e7eb; --tx2:rgba(255,255,255,0.6); --tx3:rgba(255,255,255,0.5); --ac:#6366f1; --ac2:#818cf8;
    --ok:#34d399; --okbg:rgba(52,211,153,0.12); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--tx); font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; padding:24px 28px; }
  h1{ font-size:1.15rem; font-weight:800; margin-bottom:4px; }
  .sub{ font-size:.8rem; color:var(--tx3); margin-bottom:20px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:900px; }
  @media(max-width:760px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:18px 18px 20px; }
  .card.active{ border-color:rgba(99,102,241,0.5); box-shadow:0 0 0 1px rgba(99,102,241,0.3); }
  .ch{ display:flex; align-items:center; gap:8px; font-size:.95rem; font-weight:800; margin-bottom:4px; }
  .ch .badge{ margin-left:auto; font-size:.7rem; font-weight:700; padding:3px 9px; border-radius:7px; background:rgba(255,255,255,0.06); color:var(--tx3); }
  .ch .badge.on{ background:var(--okbg); color:var(--ok); }
  .cd{ font-size:.75rem; color:var(--tx3); margin-bottom:14px; }
  label{ display:block; font-size:.74rem; color:var(--tx2); margin:10px 0 5px; }
  input{ width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--bd2); border-radius:9px; color:var(--tx);
    font-size:.85rem; padding:9px 11px; outline:none; font-family:inherit; }
  input:focus{ border-color:var(--ac); box-shadow:0 0 0 3px rgba(99,102,241,.14); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .save{ margin-top:16px; width:100%; font-family:inherit; font-size:.86rem; font-weight:700; color:#fff;
    background:var(--ac); border:none; border-radius:9px; padding:10px; cursor:pointer; }
  .save:hover{ filter:brightness(1.08); }
  .tip{ font-size:.72rem; color:var(--tx3); margin-top:20px; max-width:900px; line-height:1.6; }
  .tip b{ color:var(--tx2); }
</style>
</head>
<body>
  <h1>邮件发送设置</h1>
  <div class="sub">填一次，全流程通用（写完开发信 → 发送时自动用这里的配置）。两种方式选一种。</div>
  <div class="grid">
    <div class="card" id="smtpCard">
      <div class="ch"><i class="ti ti-mail"></i> SMTP 直发 <span class="badge" id="smtpBadge">未启用</span></div>
      <div class="cd">用你自己的邮箱直接发（Gmail / 企业邮箱等）。适合量小、要即时发。</div>
      <label>发件人显示名</label><input id="csSmtpSender" placeholder="如 Lens Sales Team">
      <label>发件邮箱</label><input id="csSmtpUser" placeholder="you@company.com">
      <div class="row2"><div><label>SMTP 服务器</label><input id="csSmtpHost" placeholder="smtp.gmail.com"></div>
        <div><label>端口</label><input id="csSmtpPort" placeholder="465"></div></div>
      <label>密码 / 应用专用密码</label><input id="csSmtpPass" type="password" placeholder="••••••••">
      <button class="save" id="csSmtpSave">保存并用 SMTP 发</button>
    </div>
    <div class="card" id="instCard">
      <div class="ch"><i class="ti ti-bolt"></i> Instantly 发 <span class="badge" id="instBadge">未启用</span></div>
      <div class="cd">推到 Instantly 批量发 + 自动跟进序列。适合量大、要养号和跟进。</div>
      <label>Instantly API Key</label><input id="csInstKey" type="password" placeholder="从 Instantly 后台复制">
      <label>Campaign ID</label><input id="csInstCampaign" placeholder="粘贴 Instantly Campaign ID">
      <button class="save" id="csInstSave">保存并用 Instantly 发</button>
    </div>
  </div>
  <div class="tip"><b>提示：</b>这两处配置和「邮件获客」流程里的发送步骤是同一份，填一次两边通用。密码只存在你本机浏览器，不上传。</div>
<script>
  const _lsg=k=>{ try{ return localStorage.getItem(k)||''; }catch(_){ return ''; } };
  const _lss=(k,v)=>{ try{ localStorage.setItem(k, v==null?'':String(v)); }catch(_){} };
  const $=id=>document.getElementById(id);
  function setBadges(){
    const m=_lsg('leadgen_send_method');
    const smtpFilled=_lsg('leadgen_smtpUser')&&_lsg('leadgen_smtpPass');
    const instFilled=_lsg('leadgen_app_instantly_campaign');
    const active=m||(instFilled?'instantly':(smtpFilled?'smtp':''));
    const sB=$('smtpBadge'), iB=$('instBadge');
    sB.textContent=active==='smtp'?'使用中':(smtpFilled?'已保存':'未启用'); sB.classList.toggle('on',active==='smtp');
    iB.textContent=active==='instantly'?'使用中':(instFilled?'已保存':'未启用'); iB.classList.toggle('on',active==='instantly');
    $('smtpCard').classList.toggle('active',active==='smtp');
    $('instCard').classList.toggle('active',active==='instantly');
  }
  function load(){
    $('csSmtpSender').value=_lsg('leadgen_smtpSenderName');
    $('csSmtpUser').value=_lsg('leadgen_smtpUser');
    $('csSmtpHost').value=_lsg('leadgen_smtpHost');
    $('csSmtpPort').value=_lsg('leadgen_smtpPort');
    $('csSmtpPass').value=_lsg('leadgen_smtpPass');
    $('csInstKey').value=_lsg('leadgen_instantly_api_key');
    $('csInstCampaign').value=_lsg('leadgen_app_instantly_campaign');
    setBadges();
  }
  const g=id=>($(id)?.value||'').trim();
  const flash=(btn,txt)=>{ const o=btn.textContent; btn.textContent=txt; setTimeout(()=>btn.textContent=o,1400); };
  $('csSmtpSave').onclick=()=>{
    _lss('leadgen_smtpSenderName',g('csSmtpSender')); _lss('leadgen_smtpUser',g('csSmtpUser'));
    _lss('leadgen_smtpHost',g('csSmtpHost')); _lss('leadgen_smtpPort',g('csSmtpPort'));
    _lss('leadgen_smtpPass',$('csSmtpPass').value||''); _lss('leadgen_send_method','smtp');
    setBadges(); flash($('csSmtpSave'),'已保存 ✓');
  };
  $('csInstSave').onclick=()=>{
    _lss('leadgen_instantly_api_key',$('csInstKey').value||''); _lss('leadgen_app_instantly_campaign',g('csInstCampaign'));
    _lss('leadgen_send_method','instantly'); setBadges(); flash($('csInstSave'),'已保存 ✓');
  };
  load();
</script>
</body>
</html>
